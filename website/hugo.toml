baseURL = 'https://dj-workstation.com/'
title = 'DJ-Workstation'

# English lives at the root, every other language in its own subdirectory (/de/, ...).
# No automatic language detection.
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

disableKinds = ['taxonomy', 'term', 'rss']

[params]
  github = 'https://github.com/sagiadinos/dj-workstation'
  author = 'Niko Sagiadinos'
  since  = 1998
  # The self-hosted runners put the newest builds here under fixed names: latest_linux_x86_64.AppImage, latest_linux_aarch64.AppImage, latest_macos.dmg, latest_windows.zip.
  downloads = '/downloads/artifacts'

# A new language needs an entry here, content/_index.<code>.md, content/download.<code>.md,
# i18n/<code>.toml and the two screenshots in static/images (taken from the app in that language).
[languages]
  [languages.en]
    label = 'English'
    locale = 'en'
    weight = 1
  [languages.de]
    label = 'Deutsch'
    locale = 'de'
    weight = 2
  [languages.fr]
    label = 'Français'
    locale = 'fr'
    weight = 3
  [languages.es]
    label = 'Español'
    locale = 'es'
    weight = 4
  [languages.el]
    label = 'Ελληνικά'
    locale = 'el'
    weight = 5
  [languages.ru]
    label = 'Русский'
    locale = 'ru'
    weight = 6

[markup.goldmark.renderer]
  unsafe = false
