#
# Hercules DJControl Starlight. The MIDI numbers were checked on the device (aseqdump) and agree with the Mixxx
# mapping. The Starlight handles Shift itself: with Shift held, deck A sends on channel 5 and deck B on channel 6.
# Faders are 14 bit (the CC and its fine part CC + 32). Pitch fader up (away from you) is faster, as on screen.
# The Starlight has no load buttons and no browse knob: Shift + Play loads the track selected in the library.

[device]
name  = "Hercules DJControl Starlight"
match = ["DJControl Starlight"]
audio = "DJControl Starlight"

[[control]]
midi   = { type = "cc", channel = 1, number = 0x00 }
action = "mixer.crossfader"
mode   = "absolute14"

# Deck A
[[control]]
midi   = { type = "note", channel = 2, number = 0x07 }
action = "deck.play"
deck   = 1

[[control]]
midi   = { type = "note", channel = 2, number = 0x06 }
action = "deck.cue"
deck   = 1

[[control]]
midi   = { type = "note", channel = 2, number = 0x0C }
action = "deck.headphones"
deck   = 1

[[control]]
midi   = { type = "note", channel = 5, number = 0x07 }
action = "deck.load"
deck   = 1

[[control]]
midi   = { type = "cc", channel = 2, number = 0x00 }
action = "deck.volume"
deck   = 1
mode   = "absolute14"

[[control]]
midi   = { type = "cc", channel = 2, number = 0x08 }
action = "deck.pitch"
deck   = 1
mode   = "absolute14"

[[control]] # jog wheel turned on top (while touched)
midi   = { type = "cc", channel = 2, number = 0x0A }
action = "deck.seek"
deck   = 1
mode   = "relative"

[[control]] # jog wheel turned at the edge
midi   = { type = "cc", channel = 2, number = 0x09 }
action = "deck.seek"
deck   = 1
mode   = "relative"

# Deck B
[[control]]
midi   = { type = "note", channel = 3, number = 0x07 }
action = "deck.play"
deck   = 2

[[control]]
midi   = { type = "note", channel = 3, number = 0x06 }
action = "deck.cue"
deck   = 2

[[control]]
midi   = { type = "note", channel = 3, number = 0x0C }
action = "deck.headphones"
deck   = 2

[[control]]
midi   = { type = "note", channel = 6, number = 0x07 }
action = "deck.load"
deck   = 2

[[control]]
midi   = { type = "cc", channel = 3, number = 0x00 }
action = "deck.volume"
deck   = 2
mode   = "absolute14"

[[control]]
midi   = { type = "cc", channel = 3, number = 0x08 }
action = "deck.pitch"
deck   = 2
mode   = "absolute14"

[[control]] # jog wheel turned on top (while touched)
midi   = { type = "cc", channel = 3, number = 0x0A }
action = "deck.seek"
deck   = 2
mode   = "relative"

[[control]] # jog wheel turned at the edge
midi   = { type = "cc", channel = 3, number = 0x09 }
action = "deck.seek"
deck   = 2
mode   = "relative"
