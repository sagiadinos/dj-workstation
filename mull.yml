# Mutation tests with Mull (.github/workflows/mutation.yml), see Architecture.md ("Mutation tests"): only src/core/,
# not the tests, the player and the fetched dependencies. The paths are regular expressions on the absolute file names.
includePaths:
  - .*/src/core/.*
excludePaths:
  - .*/_deps/.*
  - .*/third_party/.*
  # A thin adapter on the audio hardware: its settings only show on a real device
  - .*/src/core/audio_io/miniaudio_device\.cpp
# All operators, also calls (removed void calls, replaced return values) and the logical ones; the default set
# has only comparisons, boundaries, arithmetic and increments.
mutators:
  - cxx_all
  - experimental
