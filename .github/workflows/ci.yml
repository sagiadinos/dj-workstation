#
# Build, tests, sanitizers, static analysis and coverage, see Architecture.md ("Static analysis and CI").
# Linux x86_64 for now; the other platforms of FEATURES.md section 7 follow with their milestones.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Ubuntu 24.04 has no SDL3 package, so SDL3 is built from source. The CI never opens a window; the console build
# skips SDL's check for X11/Wayland development packages.
env:
  SDL_CONFIGURE_FLAGS: -DSDL_UNIX_CONSOLE_BUILD=ON

jobs:
  # ASan with LeakSanitizer and UBSan, and TSan. The test presets set the sanitizer options; every finding fails.
  # Built with warnings as errors and gcc-13, the minimum GCC from Architecture.md: this is the build and test of the
  # CI. Clang with libc++ is built on the Mac.
  sanitizers:
    name: Tests with ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-asan, linux-tsan]
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      # The runner kernel randomizes mmap with more bits than TSan's memory layout allows
      - name: Reduce address space randomization for TSan
        if: matrix.preset == 'linux-tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DDJW_WARNINGS_AS_ERRORS=ON $SDL_CONFIGURE_FLAGS

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # clang-format and clang-tidy in the versions pinned in .github/lint-requirements.txt; any finding fails.
  lint:
    name: Format and clang-tidy
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet -r .github/lint-requirements.txt
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"

      - name: clang-format
        run: |
          clang-format --version
          git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror

      # Only configuring is needed: clang-tidy reads compile_commands.json, fetched dependencies are downloaded
      - name: Configure
        run: cmake --preset linux-debug $SDL_CONFIGURE_FLAGS

      - name: clang-tidy
        run: |
          clang-tidy --version
          git ls-files 'src/*.cpp' \
            | xargs -P "$(nproc)" -n 1 clang-tidy -p build/linux-debug --quiet --warnings-as-errors='*'

  # Line coverage of src/ by the tests; the HTML report is attached to the run, the summary shown on its page.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the badge goes to the branch "badges"
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet -r .github/lint-requirements.txt
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: >
          cmake --preset linux-debug $SDL_CONFIGURE_FLAGS
          -DCMAKE_CXX_FLAGS=--coverage
          -DCMAKE_EXE_LINKER_FLAGS=--coverage

      - name: Build
        run: cmake --build --preset linux-debug

      - name: Test
        run: ctest --preset linux-debug

      - name: Report
        run: |
          mkdir -p coverage
          # The fetched dependencies are built with --coverage as well; gcov fails on some of their generated
          # sources (harfbuzz), and they are not reported anyway
          gcovr --gcov-executable gcov-13 --root . --filter 'src/' --gcov-exclude-directories '.*/_deps/.*' \
                --html-details coverage/index.html --txt coverage/summary.txt \
                --json-summary coverage/summary.json build/linux-debug
          python3 .github/scripts/coverage_badge.py coverage/summary.json coverage/coverage.svg
          { echo '### Line coverage of src/'; echo '```'; cat coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      # On main the badge is committed to the branch "badges" (an SVG made here, no external service); the README
      # shows it from there
      - name: Commit badge to the branch badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          badges=$(mktemp -d)
          cd "$badges"
          git init -q -b badges
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # the first run creates the branch without history; later ones continue it
          if git fetch -q --depth 1 origin badges; then git checkout -q -B badges FETCH_HEAD; fi
          cp "$GITHUB_WORKSPACE/coverage/coverage.svg" .
          git add coverage.svg
          if git diff --cached --quiet; then echo "badge unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "coverage badge for ${GITHUB_SHA::7}"
          git push -q origin badges
